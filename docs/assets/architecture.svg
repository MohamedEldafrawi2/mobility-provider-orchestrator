<text x="800" y="62" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#1F8A5B" text-anchor="middle" dominant-baseline="middle">MOBILITY AS A SERVICE  ·  PROVIDER AGGREGATION</text>
<text x="800" y="112" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="700" fill="#1B1F1D" text-anchor="middle" dominant-baseline="middle">One experience. Different rules.</text>
<text x="800" y="164" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="400" fill="#5B6660" text-anchor="middle" dominant-baseline="middle">The orchestration layer between a MaaS app and the transport providers behind it</text>
<text x="40" y="262" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#8A948E" text-anchor="start" dominant-baseline="middle">TRAVELLERS</text>
<text x="40" y="530" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#8A948E" text-anchor="start" dominant-baseline="middle">PLATFORM</text>
<text x="40" y="900" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#8A948E" text-anchor="start" dominant-baseline="middle">PROVIDERS</text>
<text x="800" y="250" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">MaaS app</text>
<text x="800" y="286" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#DFF3E7" text-anchor="middle" dominant-baseline="middle">Search  ·  Book  ·  Travel</text>
<text x="800" y="424" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#1F8A5B" text-anchor="middle" dominant-baseline="middle">Provider orchestration layer</text>
<text x="800" y="456" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#5B6660" text-anchor="middle" dominant-baseline="middle">one API, one model, one lifecycle, whatever each provider does</text>
<text x="312" y="530" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#1B1F1D" text-anchor="middle" dominant-baseline="middle">Shared model</text>
<text x="312" y="578" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#5B6660" text-anchor="middle" dominant-baseline="middle">locations, trips, offers,</text>
<text x="312" y="606" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#5B6660" text-anchor="middle" dominant-baseline="middle">bookings, money</text>
<text x="638" y="530" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#1B1F1D" text-anchor="middle" dominant-baseline="middle">Provider capabilities</text>
<text x="638" y="578" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#5B6660" text-anchor="middle" dominant-baseline="middle">what a provider can do,</text>
<text x="638" y="606" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#5B6660" text-anchor="middle" dominant-baseline="middle">never who it is</text>
<text x="962" y="530" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#1B1F1D" text-anchor="middle" dominant-baseline="middle">Search deadline</text>
<text x="962" y="578" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#5B6660" text-anchor="middle" dominant-baseline="middle">one deadline, a budget per</text>
<text x="962" y="606" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#5B6660" text-anchor="middle" dominant-baseline="middle">provider, partial results</text>
<text x="1288" y="530" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#1B1F1D" text-anchor="middle" dominant-baseline="middle">Booking state machine</text>
<text x="1288" y="578" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#5B6660" text-anchor="middle" dominant-baseline="middle">one lifecycle for direct,</text>
<text x="1288" y="606" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#5B6660" text-anchor="middle" dominant-baseline="middle">held and pending bookings</text>
<text x="320" y="800" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#8A948E" text-anchor="middle" dominant-baseline="middle">BUS OPERATOR</text>
<text x="320" y="832" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#1B1F1D" text-anchor="middle" dominant-baseline="middle">bus-legacy</text>
<text x="320" y="868" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="600" fill="#1F8A5B" text-anchor="middle" dominant-baseline="middle">Direct booking</text>
<text x="220" y="926" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#1F8A5B" text-anchor="middle" dominant-baseline="middle">book</text>
<text x="420" y="926" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#1F8A5B" text-anchor="middle" dominant-baseline="middle">confirmed</text>
<text x="320" y="992" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#5B6660" text-anchor="middle" dominant-baseline="middle">no holds, no status lookup</text>
<text x="800" y="800" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#8A948E" text-anchor="middle" dominant-baseline="middle">RAIL OPERATOR</text>
<text x="800" y="832" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#1B1F1D" text-anchor="middle" dominant-baseline="middle">rail-osdm</text>
<text x="800" y="868" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="600" fill="#1F8A5B" text-anchor="middle" dominant-baseline="middle">Hold, then confirm</text>
<text x="700" y="926" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#1F8A5B" text-anchor="middle" dominant-baseline="middle">hold</text>
<text x="900" y="926" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#1F8A5B" text-anchor="middle" dominant-baseline="middle">confirm</text>
<text x="800" y="992" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#5B6660" text-anchor="middle" dominant-baseline="middle">a deadline on the hold</text>
<text x="1280" y="800" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#8A948E" text-anchor="middle" dominant-baseline="middle">SHARED MOBILITY</text>
<text x="1280" y="832" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#1B1F1D" text-anchor="middle" dominant-baseline="middle">mobility-async</text>
<text x="1280" y="868" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="600" fill="#1F8A5B" text-anchor="middle" dominant-baseline="middle">Asynchronous confirmation</text>
<text x="1180" y="926" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#1F8A5B" text-anchor="middle" dominant-baseline="middle">accepted</text>
<text x="1380" y="926" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#1F8A5B" text-anchor="middle" dominant-baseline="middle">webhook</text>
<text x="1280" y="992" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#5B6660" text-anchor="middle" dominant-baseline="middle">the outcome arrives later</text>
<text x="800" y="1110" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#8A948E" text-anchor="middle" dominant-baseline="middle">Fictional providers built on public standards. No supplier data.</text>
<text x="800" y="1146" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#5B6660" text-anchor="middle" dominant-baseline="middle">mobility-provider-orchestrator  ·  Open-source reference implementation</text>
