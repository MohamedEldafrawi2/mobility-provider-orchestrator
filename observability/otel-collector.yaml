# The OpenTelemetry Collector receives traces from the API and the worker over OTLP/HTTP and
# forwards them to Jaeger (which speaks OTLP natively). Metrics are scraped by Prometheus from
# the services' own /metrics listeners and do not pass through here.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    timeout: 2s

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger]
