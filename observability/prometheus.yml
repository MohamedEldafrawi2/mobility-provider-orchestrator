# Prometheus scrapes the two internal listeners. Both require the operator key: metrics are
# operator information (per-client counts, breaker state) and never public.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8001"]
    http_headers:
      X-Admin-Key:
        values: ["dev-admin-key"]

  - job_name: worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:8002"]
    http_headers:
      X-Admin-Key:
        values: ["dev-admin-key"]
